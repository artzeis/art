<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0a1d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Imagine Seek" />
  <meta name="application-name" content="Imagine Seek" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Imagine Seek</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="brand" data-go="home" aria-label="Imagine Seek — home">✨ <span>Imagine Seek</span></button>
    <div class="stars" aria-label="Sparkle stars earned">⭐ <b id="starCount">0</b></div>
    <button class="icon-btn" id="helpBtn" aria-label="How to play">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.8"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg>
    </button>
  </header>

  <main id="app"></main>

  <nav class="tabbar" aria-label="Main">
    <button data-go="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg>Quests</button>
    <button data-go="journal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5Z"/><path d="M12 6v13.5"/></svg>Creatures</button>
    <button data-go="story">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h11a1.5 1.5 0 0 1 1.5 1.5v15l-3-2-3 2-3-2-3 2V5A1.5 1.5 0 0 1 6 3.5Z"/><path d="m12 8 .9 1.8 2 .3-1.45 1.4.35 2-1.8-.95-1.8.95.35-2L9.1 10.1l2-.3Z"/></svg>Stories</button>
    <button data-go="ar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><circle cx="12" cy="12" r="3.5"/></svg>AR Hunt</button>
    <button data-go="grownup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="14" r="4"/><path d="M11 11.5 19 4M16 7l2.5 2.5M14 9l2 2"/></svg>Grown-ups</button>
    <a class="tab-extra" href="words/">🔤 <b>Wordlings</b> — play the Dreamling word game →</a>
  </nav>

  <!-- Instructions -->
  <!-- How to Play: shown as its own page (opened from the home page or the ? button) -->
  <template id="howtoTpl">
    <h1 class="screen-title">How to <span class="grad-text">Play</span></h1>
    <p class="lead">Seven squishy friends have lost their treasures. Let's help them!</p>
    <ol class="howto">
      <li><span class="num">🔑</span><div><b>Grown-ups hide the treasures.</b> Open <em>Grown-ups</em> and hide the creature accessories
        inside, outside, or both: Scribbi's Rainbow Crayon, Craggle's Glow Crystal, Orbit's Moon Marble, Tangle's Golden Key, Nyxie's Wishing Star, Glitch's Power Pixel and Leo's Moon Medallion.
        Choose where you're playing, then type where you hid each one — the app writes the riddles.</div></li>
      <li><span class="num">👆</span><div><b>Pick a creature</b> who needs help.</div></li>
      <li><span class="num">🏃</span><div><b>Spin for a challenge</b> — Physical, Mental, Teamwork or Kindness — and turn the dial from Easy to Super. Harder challenges earn bonus ⭐!</div></li>
      <li><span class="num">🧩</span><div><b>Solve the riddle.</b> It tells you where to look. Stuck? Tap <em>Clue</em>, then <em>Big hint</em>.</div></li>
      <li><span class="num">🎁</span><div><b>Find it!</b> Show the creature what you found to earn ⭐ stars and unlock secret facts.</div></li>
      <li><span class="num">📜</span><div><b>Treasure trails.</b> Grown-ups can add clue stops, so each riddle leads to a clue card, then the next, then the treasure. More running, more fun!</div></li>
      <li><span class="num">🎲</span><div><b>Play together.</b> Tap 🎲 Play together on any character's page for a quick game for grown-ups and kids: Act it out, Creature charades, Dreamling says or The Invisible Box. A different one each time!</div></li>
      <li><span class="num">📚</span><div><b>The Dreamyville Storybook.</b> Every friend you help unlocks their chapter of the story.</div></li>
      <li><span class="num">🌙</span><div><b>Calm down with Nyxie.</b> Finish with 2 minutes of slow stretches and moon breathing.</div></li>
      <li><span class="num">📷</span><div><b>AR Hunt (optional).</b> First scan the room with the camera so the creature can pick a hiding spot.
        Then turn slowly, follow the 🔥 meter, and tap the creature when you see it peeking out!</div></li>
    </ol>
    <p class="safety">🛡️ Grown-ups: keep hiding spots safe and at kid height, and supervise AR mode — watch where you walk while looking at a screen.</p>
    <button class="btn primary block" data-go="home" style="margin-bottom:16px">Let's go!</button>
  </template>

  <!-- Animated intro, shown when the app opens -->
  <div id="intro" class="intro" role="dialog" aria-label="Welcome to Imagine Seek">
    <div class="intro-stars"></div>
    <div class="intro-hero">
      <div class="intro-orbit" aria-hidden="true">
      <img src="assets/characters/scribbi.png" alt="" style="left:50.0%;top:10.0%;--d:0.50s">
      <img src="assets/characters/craggle.png" alt="" style="left:81.3%;top:25.1%;--d:0.62s">
      <img src="assets/characters/orbit.png" alt="" style="left:89.0%;top:58.9%;--d:0.74s">
      <img src="assets/characters/tangle.png" alt="" style="left:67.4%;top:86.0%;--d:0.86s">
      <img src="assets/characters/nyxie.png" alt="" style="left:32.6%;top:86.0%;--d:0.98s">
      <img src="assets/characters/glitch.png" alt="" style="left:11.0%;top:58.9%;--d:1.10s">
      <img src="assets/characters/leo.png" alt="" style="left:18.7%;top:25.1%;--d:1.22s">
      </div>
      <img class="intro-icon" src="assets/icons/icon-512.png" alt="">
    </div>
    <h1 class="intro-title" aria-label="Imagine Seek">
      <span>I</span><span>m</span><span>a</span><span>g</span><span>i</span><span>n</span><span>e</span><span class="sp"> </span><span>S</span><span>e</span><span>e</span><span>k</span>
    </h1>
    <p class="intro-tag">A real-world treasure hunt where grown-ups and kids <b>imagine</b>, <b>move</b> and <b>play together</b> to help the Dreamlings find what they've lost.</p>
    <button class="btn primary intro-go" id="introGo">✨ Let's play!</button>
    <button class="intro-link" id="introHow">How to play</button>
  </div>

  <script src="js/art.js"></script>
  <script src="js/data.js"></script>
  <script src="js/challenges.js"></script>
  <script src="js/story.js"></script>
  <script src="js/together.js"></script>
  <script src="js/riddle-bank.js"></script>
  <script src="js/riddles.js"></script>
  <script src="js/voices.js"></script>
  <script src="js/calm.js"></script>
  <script src="js/ar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
