<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset=".5" stop-color="#db2777"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7c2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff7c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#2a0845" flood-opacity=".45"/>
    </filter>
    <!-- one chunky tile: base edge + face + shine -->
    <g id="tile">
      <rect x="-52" y="-46" width="104" height="104" rx="24" fill="#000" fill-opacity=".22"/>
      <rect x="-52" y="-52" width="104" height="104" rx="24" fill="currentColor"/>
      <rect x="-44" y="-46" width="88" height="40" rx="18" fill="url(#shine)"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="84" cy="96" r="120" fill="#a78bfa" opacity=".35"/>
  <circle cx="450" cy="440" r="150" fill="#fde047" opacity=".25"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>

  <!-- confetti -->
  <g>
    <rect x="58" y="300" width="20" height="9" rx="4" fill="#fde047" transform="rotate(-30 68 304)"/>
    <rect x="430" y="96" width="22" height="9" rx="4" fill="#67e8f9" transform="rotate(35 441 100)"/>
    <rect x="404" y="330" width="18" height="8" rx="4" fill="#bef264" transform="rotate(-15 413 334)"/>
    <rect x="120" y="440" width="20" height="9" rx="4" fill="#67e8f9" transform="rotate(20 130 444)"/>
    <rect x="96" y="176" width="16" height="8" rx="4" fill="#fbcfe8" transform="rotate(50 104 180)"/>
    <circle cx="452" cy="216" r="7" fill="#fde047"/>
    <circle cx="62" cy="420" r="6" fill="#fbcfe8"/>
    <circle cx="350" cy="58" r="6" fill="#bef264"/>
    <circle cx="170" cy="62" r="5" fill="#fff"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff">
    <path transform="translate(118 128) scale(1.5)" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14Z"/>
    <path transform="translate(404 404) scale(1.2)" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14Z" fill="#fef9c3"/>
    <path transform="translate(410 150) scale(.8)" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14Z"/>
  </g>

  <!-- crossword: WOW across, JOY down, crossing at O -->
  <g filter="url(#shadow)" font-family="'Fredoka','Arial Rounded MT Bold','Arial Black',Arial,sans-serif" font-weight="700" font-size="72" text-anchor="middle" fill="#2e1065">
    <!-- J (top) -->
    <g transform="translate(256 142) rotate(-6)">
      <use href="#tile" color="#f9a8d4"/>
      <text x="0" y="26">J</text>
      <text x="-36" y="-26" font-size="18" fill="#831843">1</text>
    </g>
    <!-- Y (bottom) -->
    <g transform="translate(256 370) rotate(6)">
      <use href="#tile" color="#fdba74"/>
      <text x="0" y="26">Y</text>
    </g>
    <!-- W (left) -->
    <g transform="translate(142 256) rotate(-8)">
      <use href="#tile" color="#67e8f9"/>
      <text x="0" y="26">W</text>
      <text x="-36" y="-26" font-size="18" fill="#164e63">2</text>
    </g>
    <!-- W (right) -->
    <g transform="translate(370 256) rotate(8)">
      <use href="#tile" color="#bef264"/>
      <text x="0" y="26">W</text>
    </g>
    <!-- O (center, the crossing) -->
    <g transform="translate(256 256) scale(1.12)">
      <use href="#tile" color="#fde047"/>
      <text x="0" y="26">O</text>
    </g>
  </g>
</svg>
